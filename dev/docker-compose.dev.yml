services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stelline_dev
      MYSQL_USER: stelline_dev
      # Use environment variables for secrets. Provide these in a local .env (not committed)
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-stelline_dev_password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-local-root-password}"
    ports:
      - "3307:3306"
    volumes:
      - stelline-dev-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  stelline-dev-mysql:
