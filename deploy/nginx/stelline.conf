# 공개 주소는 Vercel(stel-line.vercel.app) 하나다. Vercel 이 이 서버(168.107.1.195)의 80 번으로
# rewrite 해 보내고, 브라우저 쪽 https 는 Vercel 이 맡는다. 그래서 이 서버에는 HTTPS 블록도 인증서도
# 두지 않는다(없는 인증서 경로를 적어 두면 nginx -t 가 실패해 배포가 통째로 막힌다).

# 앱 서버는 두 벌이다(핫 스탠바이). 평소에는 본 서버(5000)만 요청을 받고, 대기 서버(5001)는 떠 있기만 한다.
# 본 서버가 연결을 거절하면(재시작·장애) nginx 가 같은 요청을 곧바로 대기 서버로 넘긴다
# (proxy_next_upstream 기본값 error timeout). 거절한 서버는 fail_timeout 동안 쉬게 하고, 그 뒤 다시 본 서버로 돌아온다.
# 배포는 대기 서버부터 새 코드로 띄워 확인한 뒤 본 서버를 다시 띄운다(deploy/deploy.sh).
# 대기 서버가 없어도(설치 전) 본 서버만으로 지금처럼 돈다. backup 은 본 서버가 안 될 때만 쓰인다.
upstream stelline_app {
    server 127.0.0.1:5000 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:5001 backup;
}

server {
    listen 80;
    listen [::]:80;
    server_name 168.107.1.195 stel-line.vercel.app;

    root /home/ubuntu/stelline/stelline/static;
    index index.html;

    location = /search {
        proxy_pass http://stelline_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /search/ {
        proxy_pass http://stelline_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ @app;
        add_header Cache-Control "no-cache" always;
    }

    # Vite 빌드 결과물은 이름에 내용 해시가 붙어, 내용이 바뀌면 이름도 바뀐다.
    # 그래서 한 번 받은 파일은 다시 물어볼 필요가 없다. index.html 은 위의 no-cache 그대로다.
    location /app/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location @app {
        proxy_pass http://stelline_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://stelline_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://stelline_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://stelline_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
