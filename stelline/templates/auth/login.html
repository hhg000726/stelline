<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인 · Stelline</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/site.css">
    <script src="/assets/theme.js"></script>
    <style>
        /* 로그인 화면은 칸 하나뿐이라 화면 가운데에 세운다. 색은 site.css 토큰을 그대로 쓴다. */
        .login-shell {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .login-card {
            width: min(100%, 360px);
            padding: 26px 24px;
            border: 1px solid var(--border);
            border-radius: var(--radius-panel);
            background: var(--surface-panel-solid);
            box-shadow: var(--shadow-panel);
        }

        .login-brand {
            display: inline-flex;
            gap: 9px;
            align-items: center;
            margin-bottom: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .login-card h1 {
            margin: 0 0 4px;
            font-size: 1.35rem;
            letter-spacing: -0.03em;
        }

        .login-card > p {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .login-card form {
            display: grid;
            gap: 10px;
        }

        .login-card label {
            display: grid;
            gap: 5px;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .login-card input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-control);
            background: var(--surface-input);
            color: var(--text);
            font: inherit;
        }

        .login-card button {
            width: 100%;
            margin-top: 4px;
            padding: 11px 14px;
        }

        .login-flash {
            margin: 0 0 14px;
            padding: 10px 12px;
            border-radius: var(--radius-control);
            background: var(--danger-soft);
            color: var(--danger);
            font-size: 0.87rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="login-card">
            <span class="login-brand"><img src="/favicon.svg" alt="" width="24" height="24">Stelline</span>
            <h1>관리자 로그인</h1>
            <p>콘텐츠 관리자 화면으로 들어가려면 로그인하세요.</p>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <p class="login-flash">{{ message }}</p>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <label>아이디
                    <input name="username" autocomplete="username" autofocus>
                </label>
                <label>비밀번호
                    <input name="password" type="password" autocomplete="current-password">
                </label>
                <button class="btn-primary" type="submit">로그인</button>
            </form>
        </div>
    </main>
</body>
</html>
