  <!-- 테마는 화면이 그려지기 전에 정해져야 한다. 본문 뒤나 번들 안에서 켜면
       밝은 화면이 한 번 번쩍인다. 그래서 이 한 조각만 <head>에 그대로 둔다.
       (버튼과 나머지 동작은 React 의 ThemeProvider 가 이어받는다.) -->
  <script>
    (function () {
      try {
        var saved = window.localStorage.getItem("stelline.theme");
        if (saved !== "light" && saved !== "dark") saved = null;
      } catch (error) { saved = null; }
      var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", saved || system);
    })();
  </script>
  <!-- 들어온 화면이 쓸 것을 번들과 함께 받기 시작한다.
       그대로 두면 번들 → 화면 조각 → 데이터가 차례로 내려와, 데이터는 번들을 다 받고 실행한 뒤에야
       출발했다. 어느 주소로 들어왔는지는 브라우저만 알므로 여기서 정한다.
       - 데이터: 화면이 쓸 GET 을 먼저 불러 window.__stellineEarly 에 둔다. 화면은 lib/api.js 의
         getJson 으로 한 번만 꺼내 쓰고, 오래됐거나 실패했으면 새로 부른다. 기록·제보처럼 무언가를
         바꾸는 요청은 여기 넣지 않는다(화면이 실제로 쓸 때만 나가야 한다).
       - 화면 조각: 이름에 내용 해시가 붙어 빌드 때만 안다. vite.config.js 가 빌드 때 아래 표를 채운다.
       - 유튜브 썸네일을 쓰는 화면은 그 주소로 미리 연결해 둔다. -->
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, "") || "/";
      var pageData = {
        "/": ["main/twits", "main/events", "bugs/rank"],
        "/search": ["search/status"],
        "/karaoke": ["karaoke/songs"],
        "/congratulation": ["congratulation/congratulations"],
        "/offline": ["offline/offline_api"]
      };
      var early = (window.__stellineEarly = {});
      if (window.fetch) {
        ["content", "main/buttons"].concat(pageData[path] || []).forEach(function (key) {
          var response = fetch("/api/" + key);
          // 아무도 꺼내 쓰지 않은 채 실패해도 콘솔에 오류를 남기지 않게 한다(꺼내 쓰는 쪽은 그대로 받는다).
          response.catch(function () {});
          early[key] = { at: Date.now(), response: response };
        });
      }
      // crossorigin 은 화면 조각을 실제로 부를 때(Vite 의 import·CSS 링크)와 같아야 한 번 받은 것을
      // 그대로 쓴다. 다르면 같은 파일을 두 번 받는다. 그림 주소에 미리 연결하는 것은 그대로 둔다.
      function hint(rel, href, as, sameCors) {
        var link = document.createElement("link");
        link.rel = rel;
        if (as) link.as = as;
        if (sameCors) link.crossOrigin = "";
        link.href = href;
        document.head.appendChild(link);
      }
      var routeFiles = {"/":["/app/MainPage-Bf0qTV1A.js","/app/EmptyState-DiSeQ4Aw.js","/app/Collapse-au6EroFT.js","/app/useApiList-BAkZtf9p.js","/app/usePageMeta-B7L4wKRg.js","/app/clipboard-BhwkPkrI.js","/app/openExternal-DSiTVUmk.js"],"/search":["/app/SearchPage-DD95kjdj.js","/app/EmptyState-DiSeQ4Aw.js","/app/ReportPanel-V-fta0BW.js","/app/loadScript-DuwNQ6MA.js","/app/Collapse-au6EroFT.js","/app/usePageMeta-B7L4wKRg.js","/app/clipboard-BhwkPkrI.js","/app/useModal-4hS1C1H_.js","/app/openExternal-DSiTVUmk.js","/app/SearchPage-CTyDYAWy.css"],"/karaoke":["/app/KaraokePage-BgXGZpDH.js","/app/EmptyState-DiSeQ4Aw.js","/app/Collapse-au6EroFT.js","/app/ReportPanel-V-fta0BW.js","/app/loadScript-DuwNQ6MA.js","/app/usePageMeta-B7L4wKRg.js","/app/clipboard-BhwkPkrI.js","/app/useModal-4hS1C1H_.js","/app/KaraokePage-Bhpe0lRA.css"],"/congratulation":["/app/CongratulationPage-BNM9YgO2.js","/app/EmptyState-DiSeQ4Aw.js","/app/loadScript-DuwNQ6MA.js","/app/ReportPanel-V-fta0BW.js","/app/Collapse-au6EroFT.js","/app/useApiList-BAkZtf9p.js","/app/usePageMeta-B7L4wKRg.js"],"/offline":["/app/OfflinePage-BYEE9faT.js","/app/EmptyState-DiSeQ4Aw.js","/app/loadScript-DuwNQ6MA.js","/app/usePageMeta-B7L4wKRg.js","/app/OfflinePage-CvhF_spN.css"]};
      (routeFiles[path] || []).forEach(function (href) {
        if (/\.css$/.test(href)) hint("preload", href, "style", true);
        else hint("modulepreload", href, "script", true);
      });
      if (path === "/search" || path === "/congratulation") hint("preconnect", "https://img.youtube.com");
    })();
  </script>
  <!-- 글꼴은 맨 뒤에 둔다. 다른 사이트의 CSS 라 받는 데 오래 걸릴 수 있는데, 문서 안의 스크립트는 앞에 놓인
       CSS 를 다 받을 때까지 실행되지 않는다. 위 두 스크립트를 이 뒤에 두었더니 미리 부르기가 글꼴 CSS 를
       기다렸다(운영에서 48ms, 휴대폰에서는 더 길다). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
