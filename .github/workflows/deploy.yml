name: CI / Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stelline_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      REQUIRE_DB: "1"
      APP_ENV: development
      START_BACKGROUND_TASKS: "false"
      AUTO_CREATE_SCHEMA: "false"
      SECRET_KEY: ci-secret-key
      SERVICE_ACCOUNT_FILE: ""
      TURNSTILE_SECRET_KEY: ""
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: test-admin-password
      RDS_HOST: 127.0.0.1
      RDS_PORT: "3306"
      RDS_USER: root
      RDS_PASSWORD: root
      RDS_DB: stelline_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # 공개 화면은 React 한 벌이고, 빌드 결과물(stelline/static/index.html, app/)은
      # 저장소에 커밋한다. 배포 서버에는 Node 를 두지 않기 때문이다.
      # 여기서 다시 빌드해 커밋된 것과 같은지 확인한다. 소스만 고치고 빌드를 잊은 채
      # 올리면 운영 화면이 예전 것으로 남는데, 그 사고가 여기서 걸린다.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check the committed build is up to date
        run: |
          if ! git diff --quiet -- stelline/static; then
            echo '빌드 결과물이 소스와 다릅니다. frontend 에서 npm run build 한 뒤 커밋하세요.'
            git diff --stat -- stelline/static
            exit 1
          fi

      # MySQL 서비스 컨테이너는 아래 services.mysql.options 의 health-check 가
      # 통과한 뒤에야 이 스텝들이 시작되므로 별도 대기 스텝은 두지 않는다.
      - name: Run tests
        run: pytest -v --cov=stelline --cov-report=term-missing

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        # 오라클 서버의 호스트 키를 알려진 호스트에 추가
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Install nginx configuration
      env:
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        scp deploy/nginx/stelline.conf $USER@$HOST:/tmp/stelline.conf
        ssh $USER@$HOST 'sudo install -m 644 /tmp/stelline.conf /etc/nginx/sites-available/stelline && sudo mv /etc/nginx/sites-enabled/default /tmp/stelline-nginx-default && sudo ln -s /etc/nginx/sites-available/stelline /etc/nginx/sites-enabled/default && if sudo nginx -t; then sudo systemctl reload nginx; sudo rm -f /tmp/stelline-nginx-default /tmp/stelline.conf; else sudo rm -f /etc/nginx/sites-enabled/default; sudo mv /tmp/stelline-nginx-default /etc/nginx/sites-enabled/default; rm -f /tmp/stelline.conf; exit 1; fi'

    - name: Execute Remote Deployment Script
      env:
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        # SSH를 통해 서버의 deploy.sh 실행
        ssh $USER@$HOST 'bash ~/deploy.sh'
