# 공개 주소는 Vercel(stel-line.vercel.app) 하나다. Vercel 이 이 서버(168.107.1.195)의 80 번으로
# rewrite 해 보내고, 브라우저 쪽 https 는 Vercel 이 맡는다. 예전 도메인 stelline.xyz 는 2026-10 에
# 일부러 정리했으므로 그 이름의 HTTPS 블록과 인증서 경로는 두지 않는다(인증서가 지워지면 nginx -t 가
# 실패해 배포가 통째로 막힌다).

server {
    listen 80;
    listen [::]:80;
    server_name 168.107.1.195 stel-line.vercel.app;

    root /home/ubuntu/stelline/stelline/static;
    index index.html;

    location = /search {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /search/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ @app;
        add_header Cache-Control "no-cache" always;
    }

    # Vite 빌드 결과물은 이름에 내용 해시가 붙어, 내용이 바뀌면 이름도 바뀐다.
    # 그래서 한 번 받은 파일은 다시 물어볼 필요가 없다. index.html 은 위의 no-cache 그대로다.
    location /app/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location @app {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}