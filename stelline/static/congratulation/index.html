<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조회수 축하</title>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background:
        radial-gradient(circle at top, rgba(96, 165, 250, 0.18), transparent 26%),
        linear-gradient(180deg, #f2f7ff 0%, #edf3fb 100%);
    }

    .site-container {
      max-width: 1180px;
      padding-top: 24px;
      padding-bottom: 48px;
    }

    .page-nav {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .congrats-hero,
    .notification-panel,
    .congrats-section {
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
      backdrop-filter: blur(12px);
    }

    .congrats-hero {
      padding: 30px 28px 24px;
      margin-bottom: 20px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #4374d9;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.15);
      border-radius: 999px;
      padding: 7px 12px;
    }

    .congrats-hero h1 {
      margin: 16px 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.05em;
      color: #111827;
      text-align: left;
    }

    .congrats-hero p {
      margin: 0;
      text-align: left;
      color: #475569;
      font-size: 1rem;
    }

    .notification-panel {
      padding: 20px 22px;
      margin-bottom: 18px;
    }

    .notification-panel h2 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      color: #1e293b;
      text-align: left;
    }

    .notification-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: flex-start;
    }

    .congrats-section {
      padding: 22px 18px 18px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding: 0 6px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 1.15rem;
      color: #111827;
      text-align: left;
    }

    .results-count {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      width: 100%;
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 100%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(248, 250, 252, 0.96));
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 22px 42px rgba(15, 23, 42, 0.12);
    }

    .thumb-wrap {
      position: relative;
      background: #dfeafc;
    }

    .thumb-wrap img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
    }

    .card .info {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
    }

    .card .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.8rem;
      color: #64748b;
    }

    .card .meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .card h3 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: #0f172a;
    }

    .card p {
      margin: 0;
      color: #64748b;
      font-size: 0.9rem;
      text-align: left;
    }

    .card .cta {
      width: 100%;
      margin-top: auto;
    }

    .card .btn-primary {
      width: 100%;
      align-self: stretch;
      justify-content: center;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      margin: 0;
    }

    footer {
      margin-top: 22px;
      padding: 0 8px;
      color: #475569;
      font-size: 0.94rem;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 640px) {
      .site-container {
        padding-left: 14px;
        padding-right: 14px;
      }

      .congrats-hero,
      .notification-panel,
      .congrats-section {
        border-radius: 18px;
      }

      .congrats-hero {
        padding: 22px 18px 18px;
      }

      .congrats-hero h1,
      .congrats-hero p,
      .notification-panel h2,
      .section-header h2 {
        text-align: center;
      }

      .notification-actions,
      .section-header {
        justify-content: center;
      }

      .section-header {
        flex-direction: column;
      }

      .card-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="site-container">
    <nav class="page-nav">
      <button onclick="Stelline.goBack()" class="btn-secondary">메인으로</button>
    </nav>

    <section class="congrats-hero">
      <div class="eyebrow">live milestone</div>
      <h1>조회수 축하</h1>
      <p id="status">앱 설치 없이 알림을 받으려면 버튼을 클릭하세요.</p>
    </section>

    <section class="notification-panel">
      <h2>알림 설정</h2>
      <div class="notification-actions">
        <button id="enableNotificationsButton" class="btn-primary"><svg data-feather="bell" width="16" height="16"></svg> 알림 허용하기</button>
        <button id="disableNotificationsButton" class="btn-secondary">알림 해지하기</button>
      </div>
    </section>

    <section class="congrats-section">
      <div class="section-header">
        <h2>최근 24시간 이내 달성</h2>
        <span id="resultsCount" class="results-count">0개 기록</span>
      </div>
      <div id="congratulationTable" class="card-grid" aria-live="polite"></div>
    </section>

    <footer>
      <p>이 사이트는 개인이 운영하는 비영리 사이트입니다.<br>이 사이트는 스텔라이브 공식과는 무관합니다.<br>문제가 되는 콘텐츠가 있다면 연락 주시면 조치하겠습니다.</p>
      <p>문의: pastel525600@gmail.com</p>
    </footer>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <script src="/assets/site.js"></script>
  <script src="/congratulation/congratulation.js"></script>
  <script src="/congratulation/app.js"></script>
  <script>if(window.feather) feather.replace();</script>
</body>

</html>
