    <!-- 지도만 두면 표시된 행사가 몇 개인지, 어디에 있는지 훑어볼 수 없다.

        <div class="page-heading">

        </div>
        <label class="toggle-row">
          <input type="checkbox" id="showFutureEvents">
          아직 시작되지 않은 이벤트도 보기
        </label>
      </div>
    </section>

    <section class="section-panel offline-layout">
      <div class="offline-list" id="event-list" aria-live="polite">
        <p class="empty-state">불러오는 중…</p>
