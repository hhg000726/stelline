# 공개 주소는 Vercel(stel-line.vercel.app) 하나다. Vercel 이 이 서버(168.107.1.195)의 80 번으로
# rewrite 해 보내고, 브라우저 쪽 https 는 Vercel 이 맡는다. 그래서 이 서버에는 HTTPS 블록도 인증서도
# 두지 않는다(없는 인증서 경로를 적어 두면 nginx -t 가 실패해 배포가 통째로 막힌다).

# 앱 서버는 두 벌이다(핫 스탠바이). 평소에는 본 서버(5000)만 요청을 받고, 대기 서버(5001)는 떠 있기만 한다.
# 본 서버가 연결을 거절하면(재시작·장애) nginx 가 같은 요청을 곧바로 대기 서버로 넘긴다
# (proxy_next_upstream 기본값 error timeout). 거절한 서버는 fail_timeout 동안 쉬게 하고, 그 뒤 다시 본 서버로 돌아온다.
# 배포는 대기 서버부터 새 코드로 띄워 확인한 뒤 본 서버를 다시 띄운다(deploy/deploy.sh).
# 대기 서버가 없어도(설치 전) 본 서버만으로 지금처럼 돈다. backup 은 본 서버가 안 될 때만 쓰인다.
upstream stelline_app {
    server 127.0.0.1:5000 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:5001 backup;
}

server {
    listen 80;
    listen [::]:80;
    server_name 168.107.1.195 stel-line.vercel.app;

    root /home/ubuntu/stelline/stelline/static;
    index index.html;

    # 글자로 된 응답(JSON·JS·CSS·SVG)도 줄여 보낸다. 서버의 기본 설정(/etc/nginx/nginx.conf)은 HTML 만 줄인다.
    # 예) 검색 점검 상태 JSON 105KB → 13KB. 브라우저 쪽 압축은 Vercel 이 다시 맡지만, 이 서버가 Vercel 로
    # 보내는 양이 준다. 줄일 때 nginx 가 Flask 의 ETag 를 약한 것(W/)으로 바꾸는데, 앱의 304 판정(werkzeug)은
    # If-None-Match 를 약하게 비교하므로 그대로 304 로 끝난다(tests/test_pages.py).
    # text/html 은 gzip on 이면 늘 줄이므로 gzip_types 에 다시 적지 않는다(적으면 nginx -t 가 경고한다).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = /search {
        proxy_pass http://stelline_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /search/ {
        proxy_pass http://stelline_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ @app;
        add_header Cache-Control "no-cache" always;
    }

    # 그림·아이콘(og 이미지, 검색 안내 그림과 WebP 사본, 파비콘)은 하루 캐시한다. Vercel 도 이 값을 보고
    # 받아 둔다. no-cache 일 때는 Vercel 이 매번 이 서버에 다시 물어, 디시인사이드 글의 링크 카드가 불러 가는
    # og-image.png(190KB) 하나가 서버 전송량의 69%였다(2026-11).
    # 이름이 같은 채로 그림을 바꾸면 최대 하루 옛 그림이 보인다. 바꿀 때는 이름을 바꾸거나 참조에 ?v= 를 붙인다
    # (README '정적 파일 캐시와 그림 바꾸기'). 없는 파일은 예전처럼 앱이 답한다.
    # always 를 붙이지 않는다. 붙이면 오류 응답에도 이 캐시가 붙는다.
    location ~* \.(?:png|jpe?g|gif|webp|ico|svg)$ {
        try_files $uri @app;
        add_header Cache-Control "public, max-age=86400";
    }

    # Vite 빌드 결과물은 이름에 내용 해시가 붙어, 내용이 바뀌면 이름도 바뀐다.
    # 그래서 한 번 받은 파일은 다시 물어볼 필요가 없다. index.html 은 위의 no-cache 그대로다.
    # ^~ 는 위의 그림 규칙(정규식)보다 이 자리를 먼저 쓰게 한다.
    # always 를 붙이지 않는다. 붙이면 없는 파일의 404 에도 1년 캐시가 붙어 Vercel 이 그 404 를 들고 있는다
    # (2026-11 확인: 두 번째 요청이 HIT). 배포를 되돌려 같은 이름이 다시 생겨도 방문자는 404 를 받게 된다.
    location ^~ /app/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @app {
        proxy_pass http://stelline_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 아래 셋은 앱이 답하는 주소다. ^~ 로 그림 규칙(정규식)보다 먼저 잡아, 주소가 .png 로 끝나도 늘 앱으로 보낸다.
    location ^~ /api/ {
        proxy_pass http://stelline_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin {
        proxy_pass http://stelline_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /auth {
        proxy_pass http://stelline_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
