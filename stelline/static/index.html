<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메인 페이지</title>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
  <main class="site-container">
    <header class="site-header">
      <div>
        <div class="site-sub">Stelline</div>
        <div class="site-sub">검색 보조 도구 및 알림</div>
      </div>
    </header>

    <section class="hero max-w-4xl mx-auto text-center">
      <p class="mt-3 text-base text-slate-600">검색이 잘 안되는 영상과 조회수 알림을 관리합니다. 아래 버튼으로 기능을 바로 이용하세요.</p>
      <div class="hero-actions mt-6 flex gap-3 justify-center flex-wrap">
        <button onclick="location.href='./search'" class="btn-primary">검색 안되는 노래 보기 <svg data-feather="search" width="16" height="16"></svg></button>
        <button onclick="location.href='./congratulation'" class="btn-secondary">조회수 축하 알림 <svg data-feather="bell" width="16" height="16"></svg></button>
      </div>
    </section>

    <section class="info-stack" style="margin-top:18px">
      <div class="section-panel">
        <div class="section-header">
          <h2>트윗 안내</h2>
        </div>
        <div id="twitContainer" class="stack-list"></div>
      </div>

      <div class="section-panel">
        <div class="section-header">
          <h2>이벤트·펀딩</h2>
        </div>
        <div id="button-container" class="button-grid"></div>
      </div>

      <div class="section-panel">
        <div class="section-header">
          <h2>벅스 순위</h2>
        </div>
        <div id="bugs" class="stack-list"></div>
      </div>
    </section>

    <footer>
      <p>이 사이트는 개인이 운영하는 비영리 사이트입니다.<br>이 사이트는 스텔라이브 공식과는 무관합니다.<br>문제가 되는 콘텐츠가 있다면 연락 주시면 조치하겠습니다.</p>
      <p>문의: pastel525600@gmail.com</p>
    </footer>
  </main>

  <script src="/assets/site.js"></script>
  <script src="/index.js"></script>
  <script>if(window.feather) feather.replace();</script>
</body>

</html>
